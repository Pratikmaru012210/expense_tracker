repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
