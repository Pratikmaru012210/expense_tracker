name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-pr-source:
    name: Validate PR source branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Verify source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ Pull requests to main can only come from the dev branch."
            echo "Source branch: ${{ github.head_ref }}"
            echo "Target branch: ${{ github.base_ref }}"
            exit 1
          fi

          echo "✅ Valid PR: ${{ github.head_ref }} → ${{ github.base_ref }}"

  frontend-test:
    needs: validate-pr-source
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/dist

  backend-test:
    needs: frontend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        run: pytest

  deploy-preview:
    needs: backend-test
    runs-on: ubuntu-latest

    environment:
      name: Preview

    steps:
      - name: Deploy to Preview
        run: echo "Deploying application to Preview environment"

  deploy-staging:
    needs: deploy-preview
    runs-on: ubuntu-latest

    environment:
      name: Staging

    steps:
      - name: Deploy to Staging
        run: echo "Deploying application to Staging environment"
